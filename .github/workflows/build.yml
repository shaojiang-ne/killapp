name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # 冒烟测试：确认 CLI 还能用（不打包，快）
  smoke:
    name: Smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all sources
        run: python -m py_compile core.py gui.py winproc.py winadmin.py killapp.py killapp_gui.py build.py

      - name: CLI smoke test
        shell: cmd
        run: |
          python killapp.py list > list.txt
          python killapp.py ls > ls.txt
          python killapp.py ports > ports.txt
          python killapp.py search node > search.txt
          type list.txt
          type ls.txt
          type ports.txt
          type search.txt

      - name: Check the CLI produced output
        shell: pwsh
        run: |
          foreach ($f in 'list.txt','ls.txt','ports.txt','search.txt') {
            if (-not (Test-Path $f)) { throw "$f was not produced" }
            if ((Get-Item $f).Length -lt 20) { throw "$f is suspiciously small" }
          }
          Write-Host "CLI output OK"

  # 打包：打 tag 时顺便发一个 Release
  package:
    name: Package exe
    runs-on: windows-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build killapp.exe
        run: python build.py

      - name: Check the exe
        shell: pwsh
        run: |
          $exe = 'dist\killapp.exe'
          if (-not (Test-Path $exe)) { throw "dist\killapp.exe was not produced" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "killapp.exe = $mb MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: killapp-windows
          path: dist/killapp.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/killapp.exe
          generate_release_notes: true
